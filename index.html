<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .video-wrapper {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .overlay-btn {
      position: absolute;
      inset: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
    }



    /* Icon flash */
    .icon-flash {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      width: 110px;
      height: 110px;
      background: rgba(0,0,0,0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
    }
    .icon-flash svg { width: 52px; height: 52px; fill: #fff; }
    .icon-flash.show { animation: flashPop 0.6s ease forwards; }

    @keyframes flashPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      50%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    .counter {
      flex-shrink: 0;
      text-align: center;
      padding: 14px 10px;
      font-size: 20px;
      color: #444;
      background: #fff;
      border-top: 2px solid #e0e0e0;
    }
    .counter span { font-weight: bold; color: #111; font-size: 24px; }

    .controls {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      border-top: 2px solid #e0e0e0;
    }
    .controls button {
      flex: 1;
      padding: 26px 10px;
      background: #fff;
      color: #222;
      border: none;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      transition: background 0.15s;
    }
    .controls button + button { border-left: 2px solid #e0e0e0; }
    .controls button:hover    { background: #f0f0f0; }
    .controls button.active   { background: #222; color: #fff; }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <!-- muted + autoplay: bat buoc de trinh duyet cho phep tu phat -->
    <video id="vid" src="chu dai bi.mp4" playsinline></video>

    <div class="icon-flash" id="iconFlash">
      <svg id="iconSvg" viewBox="0 0 24 24"></svg>
    </div>
    <button class="overlay-btn" id="overlayBtn"></button>
  </div>

  <div class="counter" id="counterRow">Con lai: <span>1</span> lan</div>

  <div class="controls">
    <button id="btn1"   class="active" onclick="setMode(1)">Phat 1 lan</button>
    <button id="btn10"  onclick="setMode(10)">Phat 10 lan</button>
    <button id="btnInf" onclick="setMode(-1)">Phat mai mai</button>
  </div>

  <script>
    const vid        = document.getElementById('vid');
    const overlayBtn = document.getElementById('overlayBtn');
    const counterRow = document.getElementById('counterRow');
    const iconFlash  = document.getElementById('iconFlash');
    const iconSvg    = document.getElementById('iconSvg');

    const PATH_PLAY  = 'M8 5v14l11-7z';
    const PATH_PAUSE = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';

    let mode  = 1;
    let count = 0;
    let flashTimer = null;

    function showIcon(playing) {
      iconSvg.innerHTML = '<path d="' + (playing ? PATH_PAUSE : PATH_PLAY) + '"/>';
      iconFlash.classList.remove('show');
      void iconFlash.offsetWidth;
      iconFlash.classList.add('show');
      if (flashTimer) clearTimeout(flashTimer);
      flashTimer = setTimeout(() => iconFlash.classList.remove('show'), 650);
    }

    function updateCounter() {
      if (mode === -1) {
        counterRow.innerHTML = 'Da phat: <span>' + count + '</span> lan';
      } else {
        const rem = mode - count;
        if (rem <= 0) {
          counterRow.innerHTML = 'Da phat xong <span>' + mode + '</span> lan';
        } else {
          counterRow.innerHTML = 'Con lai: <span>' + rem + '</span> lan';
        }
      }
    }

    function setMode(m) {
      mode  = m;
      count = 0;
      vid.loop = (m === -1);
      vid.pause();
      vid.currentTime = 0;
      document.getElementById('btn1').classList.toggle('active', m === 1);
      document.getElementById('btn10').classList.toggle('active', m === 10);
      document.getElementById('btnInf').classList.toggle('active', m === -1);
      updateCounter();
    }

    overlayBtn.addEventListener('click', () => {
      if (vid.paused) {
        vid.play();
        showIcon(true);
      } else {
        vid.pause();
        showIcon(false);
      }
    });

    vid.addEventListener('ended', () => {
      count++;
      updateCounter();
      if (mode === -1) return;
      if (count < mode) {
        vid.currentTime = 0;
        vid.play();
      }
    });
  </script>

</body>
</html>
